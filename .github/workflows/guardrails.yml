name: guardrails

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: guardrails behave as documented
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The hooks and orchestration are cross-platform by claim, so the claim
      # gets tested on both. Windows is where the shell and path assumptions
      # break - short names, junctions, backslashes, CRLF.
      #
      # check.mjs builds its own throwaway repositories and COPILOT_HOME, so it
      # needs no setup and touches nothing outside the temp directory.
      - name: Guardrails, config resolution, waves, installer
        run: node scripts/check.mjs
